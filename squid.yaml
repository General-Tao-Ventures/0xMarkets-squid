manifest_version: subsquid.io/v0.1
name: 0xmarkets-base-mainnet
version: 1
description: 0xMarkets indexer for Base mainnet (self-hosted; CHAIN_ID=84532 for Sepolia)

build:

deploy:
  addons:
    postgres:
  processor:
    cmd: ["node", "lib/main.js"]
    env:
      CHAIN_ID: "8453"
  api:
    cmd: ["npx", "squid-graphql-server"]

scale:
  dedicated: false
